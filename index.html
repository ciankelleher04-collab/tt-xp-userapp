<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT XP Data Test</title>
    <style>
        :root {
            --bg: #121419;
            --panel: #1b1e25;
            --border: #303540;
            --text: #f2f4f7;
            --muted: #9299a6;
            --accent: #4f9cff;
            --good: #68d391;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: transparent;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        #app {
            position: fixed;
            top: 50px;
            left: 50px;
            width: 640px;
            max-width: calc(100vw - 100px);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .title {
            font-weight: 700;
        }

        #status {
            margin-left: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        #status.connected {
            color: var(--good);
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #282d36;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #343a46;
        }

        main {
            padding: 12px;
        }

        .note {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            padding: 8px 9px;
            border-bottom: 1px solid #242831;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        th:first-child,
        td:first-child {
            width: 42%;
        }

        td {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .missing {
            color: var(--muted);
        }

        footer {
            padding: 8px 12px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div>
                <span class="title">TT XP Data Test</span>
                <span id="status">Waiting for data...</span>
            </div>

            <div class="buttons">
                <button id="refreshBtn">Refresh</button>
                <button id="pinBtn">Pin</button>
                <button id="closeBtn">Close</button>
            </div>
        </header>

        <main>
            <div class="note">
                This test only requests the few values we need for the XP calculator.
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </main>

        <footer>
            If inventory is long, take a screenshot or copy the visible value manually.
        </footer>
    </div>

    <script>
        const wantedKeys = [
            "user_id",
            "pkey",
            "inventory",
            "exp_hunting_skill",
            "exp_farming_fishing"
        ];

        const values = {};
        const rows = document.getElementById("rows");
        const status = document.getElementById("status");

        function send(payload) {
            window.parent.postMessage(payload, "*");
        }

        function formatValue(value) {
            if (value === undefined) return "Not received";
            if (value === null) return "null";

            if (typeof value === "object") {
                try {
                    return JSON.stringify(value, null, 2);
                } catch {
                    return String(value);
                }
            }

            const text = String(value);

            if (
                (text.startsWith("{") && text.endsWith("}")) ||
                (text.startsWith("[") && text.endsWith("]"))
            ) {
                try {
                    return JSON.stringify(JSON.parse(text), null, 2);
                } catch {}
            }

            return text;
        }

        function render() {
            rows.innerHTML = "";

            for (const key of wantedKeys) {
                const row = document.createElement("tr");
                const keyCell = document.createElement("td");
                const valueCell = document.createElement("td");

                keyCell.textContent = key;
                valueCell.textContent = formatValue(values[key]);

                if (values[key] === undefined) {
                    valueCell.classList.add("missing");
                }

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                rows.appendChild(row);
            }
        }

        function requestData() {
            send({
                type: "getNamedData",
                keys: wantedKeys
            });
        }

        window.addEventListener("message", event => {
            const evt = event.data;

            if (!evt || typeof evt !== "object" || !evt.data || typeof evt.data !== "object") {
                return;
            }

            let changed = false;

            for (const key of wantedKeys) {
                if (Object.prototype.hasOwnProperty.call(evt.data, key)) {
                    values[key] = evt.data[key];
                    changed = true;
                }
            }

            if (changed) {
                status.textContent = "Connected";
                status.classList.add("connected");
                render();
            }
        });

        document.getElementById("refreshBtn").addEventListener("click", requestData);

        document.getElementById("pinBtn").addEventListener("click", () => {
            send({ type: "pin" });
        });

        document.getElementById("closeBtn").addEventListener("click", () => {
            send({ type: "close" });
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                send({ type: "pin" });
            }
        });

        window.addEventListener("load", () => {
            render();
            setTimeout(requestData, 250);
        });
    </script>
</body>
</html>
