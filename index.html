<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT XP Cache Probe</title>
    <style>
        :root {
            --bg: #121419;
            --panel: #1b1e25;
            --border: #303540;
            --text: #f2f4f7;
            --muted: #9299a6;
            --good: #68d391;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: transparent;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        #app {
            position: fixed;
            top: 45px;
            left: 45px;
            width: 800px;
            max-width: calc(100vw - 90px);
            max-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .title {
            font-weight: 700;
        }

        #status {
            margin-left: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        #status.connected {
            color: var(--good);
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #282d36;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #343a46;
        }

        main {
            padding: 12px;
            overflow: auto;
        }

        .note {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            padding: 8px 9px;
            border-bottom: 1px solid #242831;
            text-align: left;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--bg);
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            z-index: 1;
        }

        th:first-child,
        td:first-child {
            width: 46%;
        }

        td {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .empty {
            color: var(--muted);
        }

        footer {
            padding: 8px 12px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            flex-shrink: 0;
        }

        #copyArea {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div>
                <span class="title">TT XP Cache Probe</span>
                <span id="status">Waiting for data...</span>
            </div>

            <div class="buttons">
                <button id="refreshBtn">Refresh</button>
                <button id="copyBtn">Copy Results</button>
                <button id="pinBtn">Pin</button>
                <button id="closeBtn">Close</button>
            </div>
        </header>

        <main>
            <div class="note">
                Requests the full cache once, but only displays keys that look relevant to XP, skills, bonuses, boosts, SOTD, hunting or fishing.
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </main>

        <footer id="footerText">
            Waiting for a full cache response.
        </footer>
    </div>

    <textarea id="copyArea" readonly></textarea>

    <script>
        const terms = [
            "exp",
            "xp",
            "skill",
            "bonus",
            "boost",
            "sotd",
            "hunting",
            "fishing",
            "fish",
            "bear"
        ];

        const ignoredKeys = new Set([
            "inventory"
        ]);

        const values = {};
        const rows = document.getElementById("rows");
        const status = document.getElementById("status");
        const footerText = document.getElementById("footerText");
        const copyArea = document.getElementById("copyArea");

        function send(payload) {
            window.parent.postMessage(payload, "*");
        }

        function isRelevantKey(key) {
            if (ignoredKeys.has(key)) return false;

            const lower = key.toLowerCase();
            return terms.some(term => lower.includes(term));
        }

        function formatValue(value) {
            if (value === undefined) return "undefined";
            if (value === null) return "null";

            if (typeof value === "object") {
                try {
                    const text = JSON.stringify(value);
                    return text.length > 500 ? `${text.slice(0, 500)}...` : text;
                } catch {
                    return String(value);
                }
            }

            const text = String(value);
            return text.length > 500 ? `${text.slice(0, 500)}...` : text;
        }

        function relevantEntries() {
            return Object.entries(values)
                .filter(([key]) => isRelevantKey(key))
                .sort(([a], [b]) => a.localeCompare(b));
        }

        function render() {
            rows.innerHTML = "";

            const entries = relevantEntries();

            if (!entries.length) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 2;
                cell.className = "empty";
                cell.textContent = "No matching cache keys found yet.";

                row.appendChild(cell);
                rows.appendChild(row);

                footerText.textContent = "No matching keys found.";
                return;
            }

            for (const [key, value] of entries) {
                const row = document.createElement("tr");
                const keyCell = document.createElement("td");
                const valueCell = document.createElement("td");

                keyCell.textContent = key;
                valueCell.textContent = formatValue(value);

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                rows.appendChild(row);
            }

            footerText.textContent = `${entries.length} matching cache keys found.`;
        }

        function requestData() {
            send({ type: "getData" });
        }

        function buildCopyText() {
            const entries = relevantEntries();
            const lines = ["TT XP Cache Probe", ""];

            if (!entries.length) {
                lines.push("No matching cache keys found.");
                return lines.join("\n");
            }

            for (const [key, value] of entries) {
                lines.push(`${key}: ${formatValue(value)}`);
            }

            return lines.join("\n");
        }

        async function copyResults() {
            const text = buildCopyText();
            let copied = false;

            try {
                await navigator.clipboard.writeText(text);
                copied = true;
            } catch {}

            if (!copied) {
                copyArea.value = text;
                copyArea.focus();
                copyArea.select();

                try {
                    copied = document.execCommand("copy");
                } catch {}
            }

            footerText.textContent = copied
                ? "Results copied to clipboard."
                : "Clipboard blocked. Take a screenshot of the table.";
        }

        window.addEventListener("message", event => {
            const evt = event.data;

            if (!evt || typeof evt !== "object" || !evt.data || typeof evt.data !== "object") {
                return;
            }

            let changed = false;

            for (const [key, value] of Object.entries(evt.data)) {
                values[key] = value;

                if (isRelevantKey(key)) {
                    changed = true;
                }
            }

            if (changed || Object.keys(values).length) {
                status.textContent = "Connected";
                status.classList.add("connected");
                render();
            }
        });

        document.getElementById("refreshBtn").addEventListener("click", requestData);
        document.getElementById("copyBtn").addEventListener("click", copyResults);

        document.getElementById("pinBtn").addEventListener("click", () => {
            send({ type: "pin" });
        });

        document.getElementById("closeBtn").addEventListener("click", () => {
            send({ type: "close" });
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                send({ type: "pin" });
            }
        });

        window.addEventListener("load", () => {
            render();
            setTimeout(requestData, 250);
        });
    </script>
</body>
</html>
