<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT XP Probe</title>
    <style>
        :root {
            --bg: #121419;
            --panel: #1b1e25;
            --border: #303540;
            --text: #f2f4f7;
            --muted: #9299a6;
            --good: #68d391;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: transparent;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        #app {
            position: fixed;
            top: 45px;
            left: 45px;
            width: 760px;
            max-width: calc(100vw - 90px);
            max-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .title {
            font-weight: 700;
        }

        #status {
            margin-left: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        #status.connected {
            color: var(--good);
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #282d36;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #343a46;
        }

        main {
            padding: 12px;
            overflow: auto;
        }

        .note {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .section {
            margin-bottom: 18px;
        }

        .section h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            padding: 8px 9px;
            border-bottom: 1px solid #242831;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        th:first-child,
        td:first-child {
            width: 46%;
        }

        td {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .missing,
        .empty {
            color: var(--muted);
        }

        footer {
            padding: 8px 12px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            flex-shrink: 0;
        }

        #copyArea {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div>
                <span class="title">TT XP Probe</span>
                <span id="status">Waiting for data...</span>
            </div>

            <div class="buttons">
                <button id="refreshBtn">Refresh</button>
                <button id="copyBtn">Copy Results</button>
                <button id="pinBtn">Pin</button>
                <button id="closeBtn">Close</button>
            </div>
        </header>

        <main>
            <div class="note">
                This version only shows XP values and inventory entries that look relevant to the calculator.
            </div>

            <div class="section">
                <h3>Player / XP</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="xpRows"></tbody>
                </table>
            </div>

            <div class="section">
                <h3>Matching Inventory Entries</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryRows"></tbody>
                </table>
            </div>
        </main>

        <footer id="footerText">
            Looking for BXP, XP bonuses, boosts, fishing, hunting, fish and bear related items.
        </footer>
    </div>

    <textarea id="copyArea" readonly></textarea>

    <script>
        const wantedKeys = [
            "user_id",
            "inventory",
            "exp_hunting_skill",
            "exp_farming_fishing"
        ];

        const inventoryTerms = [
            "exp_token",
            "exp_bonus",
            "boost",
            "fish",
            "fishing",
            "hunt",
            "hunting",
            "bear"
        ];

        const values = {};
        const xpRows = document.getElementById("xpRows");
        const inventoryRows = document.getElementById("inventoryRows");
        const status = document.getElementById("status");
        const footerText = document.getElementById("footerText");
        const copyArea = document.getElementById("copyArea");

        function send(payload) {
            window.parent.postMessage(payload, "*");
        }

        function parseInventory(raw) {
            if (!raw) return {};

            if (typeof raw === "object") {
                return raw;
            }

            if (typeof raw === "string") {
                try {
                    return JSON.parse(raw);
                } catch {
                    return {};
                }
            }

            return {};
        }

        function getAmount(item) {
            if (item && typeof item === "object" && "amount" in item) {
                return item.amount;
            }

            return item;
        }

        function matchingInventory() {
            const inventory = parseInventory(values.inventory);

            return Object.entries(inventory)
                .filter(([key]) => {
                    const lower = key.toLowerCase();
                    return inventoryTerms.some(term => lower.includes(term));
                })
                .sort(([a], [b]) => a.localeCompare(b));
        }

        function renderXp() {
            xpRows.innerHTML = "";

            const rows = [
                ["user_id", values.user_id],
                ["exp_hunting_skill", values.exp_hunting_skill],
                ["exp_farming_fishing", values.exp_farming_fishing]
            ];

            for (const [key, value] of rows) {
                const row = document.createElement("tr");
                const keyCell = document.createElement("td");
                const valueCell = document.createElement("td");

                keyCell.textContent = key;
                valueCell.textContent = value === undefined ? "Not received" : String(value);

                if (value === undefined) {
                    valueCell.classList.add("missing");
                }

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                xpRows.appendChild(row);
            }
        }

        function renderInventory() {
            inventoryRows.innerHTML = "";
            const matches = matchingInventory();

            if (!matches.length) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 2;
                cell.className = "empty";
                cell.textContent = "No matching inventory entries found.";

                row.appendChild(cell);
                inventoryRows.appendChild(row);
                return;
            }

            for (const [key, item] of matches) {
                const row = document.createElement("tr");
                const keyCell = document.createElement("td");
                const amountCell = document.createElement("td");

                keyCell.textContent = key;
                amountCell.textContent = String(getAmount(item));

                row.appendChild(keyCell);
                row.appendChild(amountCell);
                inventoryRows.appendChild(row);
            }

            footerText.textContent = `${matches.length} matching inventory entries found.`;
        }

        function render() {
            renderXp();
            renderInventory();
        }

        function requestData() {
            send({
                type: "getNamedData",
                keys: wantedKeys
            });
        }

        function buildCopyText() {
            const lines = [
                "TT XP Probe",
                "",
                `user_id: ${values.user_id ?? "Not received"}`,
                `exp_hunting_skill: ${values.exp_hunting_skill ?? "Not received"}`,
                `exp_farming_fishing: ${values.exp_farming_fishing ?? "Not received"}`,
                "",
                "Matching inventory:"
            ];

            const matches = matchingInventory();

            if (!matches.length) {
                lines.push("No matching inventory entries found.");
            } else {
                for (const [key, item] of matches) {
                    lines.push(`${key}: ${getAmount(item)}`);
                }
            }

            return lines.join("\n");
        }

        async function copyResults() {
            const text = buildCopyText();
            let copied = false;

            try {
                await navigator.clipboard.writeText(text);
                copied = true;
            } catch {}

            if (!copied) {
                copyArea.value = text;
                copyArea.focus();
                copyArea.select();

                try {
                    copied = document.execCommand("copy");
                } catch {}
            }

            footerText.textContent = copied
                ? "Results copied to clipboard."
                : "Clipboard blocked. Take a screenshot of the matching inventory table.";
        }

        window.addEventListener("message", event => {
            const evt = event.data;

            if (!evt || typeof evt !== "object" || !evt.data || typeof evt.data !== "object") {
                return;
            }

            let changed = false;

            for (const key of wantedKeys) {
                if (Object.prototype.hasOwnProperty.call(evt.data, key)) {
                    values[key] = evt.data[key];
                    changed = true;
                }
            }

            if (changed) {
                status.textContent = "Connected";
                status.classList.add("connected");
                render();
            }
        });

        document.getElementById("refreshBtn").addEventListener("click", requestData);
        document.getElementById("copyBtn").addEventListener("click", copyResults);

        document.getElementById("pinBtn").addEventListener("click", () => {
            send({ type: "pin" });
        });

        document.getElementById("closeBtn").addEventListener("click", () => {
            send({ type: "close" });
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                send({ type: "pin" });
            }
        });

        window.addEventListener("load", () => {
            render();
            setTimeout(requestData, 250);
        });
    </script>
</body>
</html>
